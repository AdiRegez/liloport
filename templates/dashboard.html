<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – Liloport</title>
<link rel="stylesheet" href="_wiki/style.css">
</head>
<body class="dashboard" data-rel="">
<header class="kopf" id="kopf">
  <a class="logo" href="index.html" title="Zum Dashboard"><img src="_wiki/logo.svg" alt=""><span>Liloport</span></a>
  <a class="dashboard-link aktiv" href="index.html" title="Zurück zum Dashboard"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10.5V20h13v-9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Dashboard</span></a>
  <span class="kopf-rechts" id="kopf-rechts"></span>
  <button class="kopf-zu" id="kopf-zu" type="button" title="Liloport-Leiste einklappen" aria-label="Liloport-Leiste einklappen">▲</button>
</header>
<button class="kopf-griff" id="kopf-griff" type="button" title="Liloport-Leiste einblenden" hidden><img src="_wiki/logo.svg" alt="">▼</button>
<div class="modus-band" id="modus-band" hidden></div>
<div class="rumpf">
<main class="inhalt dashboard-inhalt">
  <div class="dashboard-kopf">
    <div>
      <h1>Dashboard</h1>
      <p class="statistik" id="statistik"></p>
    </div>
    <button class="neu-knopf" id="plus-button" type="button" title="Neue Seite oder neues Verzeichnis"><span class="plus">+</span> Neu</button>
  </div>
  <p class="ordner-zeile" id="ordner-zeile"></p>
  <nav class="dash-reiter" id="dash-reiter" role="tablist" aria-label="Bereiche des Dashboards" hidden>
    <button type="button" role="tab" id="reiter-portfolio" data-reiter="portfolio" aria-controls="tab-portfolio">📚 Portfolio</button>
    <button type="button" role="tab" id="reiter-kompetenzen" data-reiter="kompetenzen" aria-controls="tab-kompetenzen">🎯 Kompetenzen <span class="reiter-zahl"></span></button>
    <button type="button" role="tab" id="reiter-verwaltung" data-reiter="verwaltung" aria-controls="tab-verwaltung">🛠 Verwaltung <span class="reiter-zahl"></span></button>
  </nav>
  <div class="dash-tab" id="tab-portfolio" role="tabpanel" aria-labelledby="reiter-portfolio">
    <form class="suche" id="suche" role="search"><input type="search" id="suchfeld" placeholder="Seiten durchsuchen (Titel, Text, PDF-Inhalte) …" autocomplete="off"><span class="klein-text" id="suche-info"></span></form>
    <section id="treffer" class="treffer" hidden></section>
    <div class="baum-werkzeuge" id="baum-werkzeuge"></div>
    <section id="baum" class="baum"></section>
  </div>
  <div class="dash-tab" id="tab-kompetenzen" role="tabpanel" aria-labelledby="reiter-kompetenzen" hidden></div>
  <div class="dash-tab" id="tab-verwaltung" role="tabpanel" aria-labelledby="reiter-verwaltung" hidden></div>
</main>
</div>
{{PRODUKTFUSS}}
<script src="_wiki/menu.js"></script>
<script src="_wiki/suchindex.js"></script>
<script src="_wiki/reader.js"></script>
<script src="_wiki/app.js"></script>
</body>
</html>
