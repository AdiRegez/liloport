# Baut die Installer für Windows, macOS (Apple Silicon und Intel) und Linux.
#
# Zum Ausprobieren:  GitHub → Actions → «Installer bauen» → «Run workflow».
#                    Die Installer liegen danach unten in der Zusammenfassung des Laufs («Artifacts»).
# Veröffentlichen:   Version in produkt.json setzen und committen. Dann auf GitHub → Releases →
#                    «Draft a new release» → neues Tag «v» + Version (z. B. v1.2.0) → «Publish release».
#                    Der Workflow baut und hängt die Installer nach etwa 10–15 Minuten an das Release.
# Die Dateinamen enthalten keine Versionsnummer; so führen Links wie
# https://github.com/AdiRegez/liloport/releases/latest/download/Liloport-Windows-Setup.exe
# immer zur neuesten Version.
name: Installer bauen

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artefakt: Liloport-Windows
          - os: macos-latest          # Apple Silicon (arm64)
            artefakt: Liloport-macOS-AppleSilicon
          - os: macos-15-intel        # Intel (x86_64), verfügbar bis Herbst 2027
            artefakt: Liloport-macOS-Intel
          - os: ubuntu-24.04          # glibc 2.39: Ubuntu 24.04+, Debian 13+, Fedora 40+
            artefakt: Liloport-Linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"                 # Windows: Umlaute und Zeichen wie « » in der Ausgabe
      LILOPORT_TK_PFLICHT: "1"        # ohne tkinter hätte das Programm kein Startfenster: dann abbrechen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Werkzeuge
        run: python -m pip install -r packaging/anforderungen.txt

      - name: Version des Tags prüfen
        if: github.event_name == 'release'
        shell: bash
        run: |
          v=$(python -c "import json;print(json.load(open('produkt.json',encoding='utf-8'))['version'])")
          t="${{ github.event.release.tag_name }}"
          if [ "v$v" != "$t" ]; then
            echo "::error::Tag $t passt nicht zur Version $v in produkt.json"; exit 1
          fi

      - name: Bauen (mit Tests)
        run: python packaging/bauen.py

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artefakt }}
          path: packaging/ausgabe/*
          if-no-files-found: error

  veroeffentlichen:
    if: github.event_name == 'release'
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: ausgabe
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: ausgabe/*
          tag_name: ${{ github.event.release.tag_name }}
